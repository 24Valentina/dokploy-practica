services:
  app:
    build: .
    container_name: uni-quindio-app
    ports:
      - "3001:3000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: uni-quindio-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: uniquindio
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
